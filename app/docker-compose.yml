version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: astrology_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql://postgres:password@postgres:5432/astrology_db
      - SECRET_KEY=dev-secret-key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./svg:/app/svg
      - ./uploads:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: 